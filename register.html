<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Krushi Seva Kendra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-brand">

        <img src="images/logo.png"
             alt="Krushi Seva Kendra Logo">

        <h1>Krushi Seva Kendra</h1>

        <p>
            Farmer Support & Agricultural Solutions
        </p>

    </div>


    <form class="login-form" id="registerForm">

        <h2>Create Account</h2>

        <p class="form-subtitle">
            Register as a farmer to access our services.
        </p>


        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label for="registerEmail">Email</label>

        <input
            type="email"
            id="registerEmail"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="mobile">Mobile Number</label>

        <input
            type="text"
            id="mobile"
            name="mobile"
            placeholder="Enter 10-digit mobile number"
            maxlength="10"
            required
        >


        <label for="registerPassword">Password</label>

        <input
            type="password"
            id="registerPassword"
            name="password"
            placeholder="Create a password"
            required
        >


        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            required
        >
        
        
        <label for="photo">Farmer Photo</label>
        
        <input
            type="file"
            id="photo"
            name="photo"
            accept=".jpg,.jpeg,.png"
            required
        >
        
        
        <label for="idProof">ID Proof</label>
        
        <input
            type="file"
            id="idProof"
            name="idProof"
            accept=".jpg,.jpeg,.png,.pdf"
            required
        >
        
        
        <button
            type="submit"
            class="btn primary-btn full-btn">
            Create Account
        </button>


        <button
            type="submit"
            class="btn primary-btn full-btn">
            Create Account
        </button>


        <p class="login-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </form>

</div>


<script src="js/script.js"></script>

</body>
</html>
