<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Krushi Seva Kendra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-brand">
        <img src="images/logo.png" alt="Krushi Seva Kendra Logo">

        <h1>Krushi Seva Kendra</h1>

        <p>
            Farmer Support & Agricultural Solutions
        </p>
    </div>


    <form class="login-form">

        <h2>Welcome Back</h2>

        <p class="form-subtitle">
            Login to access your farmer account.
        </p>


        <label for="email">Email / Mobile</label>

        <input
            type="text"
            id="email"
            placeholder="Enter email or mobile"
            required
        >


        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <div class="form-options">

            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">Forgot Password?</a>

        </div>


        <button type="submit" class="btn primary-btn full-btn">
            Login
        </button>


        <p class="login-footer">
            New farmer?
            <a href="register.html">Create an account</a>
        </p>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </form>

</div>
<script src="js/script.js"></script>
</body>
</html>
